version: '3.8'

services:
  nextest-db:
    image: mysql:8.0
    container_name: nextest-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: nextest
    ports:
      - "3307:3306" # Mapped to 3307 on host to avoid conflict with local MySQL
    volumes:
      - nextest_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  nextest-server:
    build: .
    container_name: nextest-server
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - DB_HOST=nextest-db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=nextest
      # Your Gemini Key for AI Auto-generation
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      nextest-db:
        condition: service_healthy

volumes:
  nextest_db_data:
